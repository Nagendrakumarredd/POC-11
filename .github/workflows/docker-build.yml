name: Build Push and Update Manifest

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build -t syamalanagendrakumarreddy/voting-app:${{ github.run_number }} .

      - name: Push Image
        run: |
          docker push syamalanagendrakumarreddy/voting-app:${{ github.run_number }}

      - name: Update Deployment Manifest
        run: |
          sed -i 's|image: .*|image: syamalanagendrakumarreddy/voting-app:${{ github.run_number }}|g' k8s/deployment.yaml

      - name: Commit Manifest Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "Update image tag to ${{ github.run_number }}" || exit 0
          git push
