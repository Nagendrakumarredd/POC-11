name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build -t syamalanagendrakumarreddy/voting-app:${{ github.run_number }} .

      - name: Push Image
        run: |
          docker push syamalanagendrakumarreddy/voting-app:${{ github.run_number }}
